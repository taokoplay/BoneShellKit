<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BoneShell Background</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#d9ece3}body{isolation:isolate;background:linear-gradient(140deg,#dcebe0,#bed9e8 60%,#f0dabb)}.orb{position:absolute;width:80vmin;height:80vmin;border-radius:50%;filter:blur(32px);opacity:.7;animation:drift 8s ease-in-out infinite alternate;will-change:transform}.a{background:#68b9a4;left:-20%;top:-30%}.b{background:#82b2e2;right:-20%;bottom:-20%;animation-delay:-4s}.c{background:#edc481;left:25%;top:30%;animation-delay:-2s;width:55vmin;height:55vmin}@keyframes drift{to{transform:translate(20vw,20vh) scale(1.2)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}@media(prefers-color-scheme:dark){html,body{background:#1b302d}body{background:linear-gradient(140deg,#17382d,#233a52 60%,#433b2e)}.orb{opacity:.3}}
</style></head><body aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></body></html>
